<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Charts</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <h1>Debug Charts Test</h1>
    
    <div style="width: 400px; height: 400px; margin: 20px;">
        <canvas id="testChart"></canvas>
    </div>
    
    <script>
        console.log('Chart.js loaded:', typeof Chart !== 'undefined');
        
        const ctx = document.getElementById('testChart');
        console.log('Canvas element found:', ctx !== null);
        
        if (ctx && typeof Chart !== 'undefined') {
            try {
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Test 1', 'Test 2', 'Test 3'],
                        datasets: [{
                            data: [10, 20, 30],
                            backgroundColor: ['#007bff', '#28a745', '#ffc107']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
                console.log('Chart created successfully');
            } catch (error) {
                console.error('Chart creation error:', error);
            }
        } else {
            console.error('Missing requirements - Canvas:', ctx, 'Chart.js:', typeof Chart !== 'undefined');
        }
    </script>
</body>
</html>
