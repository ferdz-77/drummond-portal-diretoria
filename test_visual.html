<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Visual - Gráficos Pizza</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="portais">
        <section class="portal-card">
            <h3>Teste Visual - EAD</h3>
            <canvas id="chartEADServicos"></canvas>
        </section>
        
        <section class="portal-card">
            <h3>Teste Visual - Ouvidoria</h3>
            <canvas id="chartOuvidoriaTipos"></canvas>
        </section>
        
        <section class="portal-card">
            <h3>Teste Visual - Processo Seletivo</h3>
            <canvas id="chartProcessoServicos"></canvas>
        </section>
    </div>

    <script>
        // Funções padronizadas
        function getPieChartOptions() {
          return {
            responsive: true,
            maintainAspectRatio: true,
            aspectRatio: 1,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  padding: 20,
                  usePointStyle: true,
                  font: {
                    size: 12
                  }
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const total = context.dataset.data.reduce((sum, value) => sum + value, 0);
                    const percentage = ((context.parsed / total) * 100).toFixed(1);
                    return context.label + ': ' + context.parsed + ' (' + percentage + '%)';
                  }
                }
              }
            }
          };
        }

        function getPieChartColors(count) {
          const colors = [
            "rgba(255, 99, 132, 0.8)",
            "rgba(54, 162, 235, 0.8)", 
            "rgba(255, 206, 86, 0.8)",
            "rgba(75, 192, 192, 0.8)",
            "rgba(153, 102, 255, 0.8)",
            "rgba(255, 159, 64, 0.8)",
            "rgba(199, 199, 199, 0.8)",
            "rgba(83, 102, 255, 0.8)"
          ];
          return colors.slice(0, count);
        }

        // Dados de teste
        const testData1 = [25, 30, 45];
        const testLabels1 = ["Categoria A", "Categoria B", "Categoria C"];

        const testData2 = [15, 35, 25, 25];
        const testLabels2 = ["Tipo 1", "Tipo 2", "Tipo 3", "Tipo 4"];

        const testData3 = [40, 35, 25];
        const testLabels3 = ["Serviço X", "Serviço Y", "Serviço Z"];

        // Gráfico EAD
        const ctx1 = document.getElementById('chartEADServicos').getContext('2d');
        new Chart(ctx1, {
            type: 'pie',
            data: {
                labels: testLabels1,
                datasets: [{
                    data: testData1,
                    backgroundColor: getPieChartColors(testData1.length)
                }]
            },
            options: getPieChartOptions()
        });

        // Gráfico Ouvidoria
        const ctx2 = document.getElementById('chartOuvidoriaTipos').getContext('2d');
        new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: testLabels2,
                datasets: [{
                    data: testData2,
                    backgroundColor: getPieChartColors(testData2.length)
                }]
            },
            options: getPieChartOptions()
        });

        // Gráfico Processo Seletivo
        const ctx3 = document.getElementById('chartProcessoServicos').getContext('2d');
        new Chart(ctx3, {
            type: 'pie',
            data: {
                labels: testLabels3,
                datasets: [{
                    data: testData3,
                    backgroundColor: getPieChartColors(testData3.length)
                }]
            },
            options: getPieChartOptions()
        });
    </script>
</body>
</html>
