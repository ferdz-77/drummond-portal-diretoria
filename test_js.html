<!DOCTYPE html>
<html>
<head>
    <title>Teste JS</title>
</head>
<body>
    <h1>Teste JavaScript Dashboard</h1>
    <div id="test"></div>

    <script>
        // Simular os dados como no dashboard
        var secretariaServicos = [{"categoria":"Informa\u00e7\u00f5es","count":4}];
        console.log("Dados:", secretariaServicos);

        var labelsSecretariaServ = secretariaServicos.length > 0
            ? secretariaServicos.map((item) => item.categoria || item.tipo || item.servico)
            : ["Histórico Escolar", "Declarações", "Certificados"];

        console.log("Labels:", labelsSecretariaServ);

        document.getElementById('test').innerHTML = "Labels: " + labelsSecretariaServ.join(', ');
    </script>
</body>
</html>
