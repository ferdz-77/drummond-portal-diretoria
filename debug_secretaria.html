<?php
include 'includes/config.php';
include 'data/data_secretaria.php';

$secretariaServicos = getSecretariaServicos();
$secretariaStatus = getSecretariaStatus();
?>

<!DOCTYPE html>
<html>
<head>
    <title>Debug Secretaria Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Debug - Charts da Secretaria</h1>

    <h2>Dados PHP:</h2>
    <pre><?php echo json_encode($secretariaServicos, JSON_PRETTY_PRINT); ?></pre>
    <pre><?php echo json_encode($secretariaStatus, JSON_PRETTY_PRINT); ?></pre>

    <h2>Charts:</h2>
    <canvas id="chartSecretariaStatus" width="400" height="200"></canvas>
    <canvas id="chartSecretariaServicos" width="400" height="200"></canvas>

    <script>
        var secretariaServicos = <?php echo json_encode($secretariaServicos); ?>;
        var secretariaStatus = <?php echo json_encode($secretariaStatus); ?>;

        console.log("Dados recebidos:", secretariaServicos);

        // Status
        var ctxSecretariaStatus = document.getElementById("chartSecretariaStatus").getContext("2d");
        var labelsSecretaria = secretariaStatus.map(item => item.status);
        var dataSecretaria = secretariaStatus.map(item => item.count);
        new Chart(ctxSecretariaStatus, {
            type: "bar",
            data: {
                labels: labelsSecretaria,
                datasets: [{
                    label: "Solicitações",
                    data: dataSecretaria,
                    backgroundColor: ["rgba(255, 99, 132, 0.5)", "rgba(75, 192, 192, 0.5)"]
                }]
            }
        });

        // Serviços
        var ctxSecretariaServicos = document.getElementById("chartSecretariaServicos").getContext("2d");

        alert("Executando JS. Dados: " + JSON.stringify(secretariaServicos));

        var labelsSecretariaServ = secretariaServicos.length > 0
            ? secretariaServicos.map(item => {
                console.log("Processando item:", item);
                return item.categoria || item.tipo || item.servico || "undefined";
            })
            : ["Histórico Escolar", "Declarações", "Certificados"];

        alert("Labels gerados: " + JSON.stringify(labelsSecretariaServ));

        var dataSecretariaServ = secretariaServicos.length > 0
            ? secretariaServicos.map(item => item.count)
            : [30, 22, 16];

        new Chart(ctxSecretariaServicos, {
            type: "pie",
            data: {
                labels: labelsSecretariaServ,
                datasets: [{
                    data: dataSecretariaServ,
                    backgroundColor: ["rgba(255, 206, 86, 0.5)", "rgba(153, 102, 255, 0.5)", "rgba(255, 159, 64, 0.5)"]
                }]
            }
        });
    </script>
</body>
</html>
