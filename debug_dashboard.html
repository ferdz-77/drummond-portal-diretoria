    <h2>JavaScript Test</h2>

    <script>
        var eadServicos = <?php echo json_encode($ead_servicos); ?>;

        console.log("Secretaria:", secretariaServicos);

        var eadLabels = eadServicos.length > 0

            ? secretariaServicos.map((item) => item.categoria || item.tipo || item.servico)
            : ["Default"];

        document.getElementById('test').innerHTML =
            "<p>EAD Labels: " + eadLabels.join(', ') + "</p>" +
            "<p>Secretaria Labels: " + secretariaLabels.join(', ') + "</p>";
    </script>
