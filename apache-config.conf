# Arquivo de configuração Apache para Portal Diretoria
# Salve como: /etc/apache2/sites-available/portal-diretoria.conf

<VirtualHost *:80>
    ServerName portal-diretoria.drummond.com.br
    DocumentRoot /var/www/html/portal_diretoria

    <Directory /var/www/html/portal_diretoria>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Segurança adicional
        php_value upload_max_filesize 50M
        php_value post_max_size 50M
        php_value max_execution_time 300
        php_value memory_limit 256M
    </Directory>

    # Logs específicos
    ErrorLog /var/log/apache2/portal_diretoria_error.log
    CustomLog /var/log/apache2/portal_diretoria_access.log combined

    # Configurações de segurança
    <Files "config_env_simplificado.php">
        Require all denied
    </Files>

    <Files ".env">
        Require all denied
    </Files>
</VirtualHost>

# Para HTTPS (opcional, configure SSL)
<VirtualHost *:443>
    ServerName portal-diretoria.drummond.com.br
    DocumentRoot /var/www/html/portal_diretoria

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /var/www/html/portal_diretoria>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Segurança adicional
        php_value upload_max_filesize 50M
        php_value post_max_size 50M
        php_value max_execution_time 300
        php_value memory_limit 256M
    </Directory>

    # Logs específicos
    ErrorLog /var/log/apache2/portal_diretoria_ssl_error.log
    CustomLog /var/log/apache2/portal_diretoria_ssl_access.log combined

    # Configurações de segurança
    <Files "config_env_simplificado.php">
        Require all denied
    </Files>

    <Files ".env">
        Require all denied
    </Files>
</VirtualHost>